const MON3={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const MONN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseDates(s){ s=String(s??""); const hits=[]; let m;
  const add=(i,len,y,mo,d)=>{ if(mo==null||mo<0||mo>11||d<1||d>31) return; if(y<100) y+=2000; hits.push({i,len,d:new Date(Date.UTC(y,mo,d))}); };
  const r1=/([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/g; while((m=r1.exec(s))) add(m.index,m[0].length,+m[3],MON3[m[1].slice(0,3).toLowerCase()],+m[2]);
  const r2=/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/g; while((m=r2.exec(s))) add(m.index,m[0].length,+m[3],MON3[m[2].slice(0,3).toLowerCase()],+m[1]);
  const r3=/(\d{4})-(\d{2})-(\d{2})/g; while((m=r3.exec(s))) add(m.index,m[0].length,+m[1],+m[2]-1,+m[3]);
  const r4=/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/g; while((m=r4.exec(s))) add(m.index,m[0].length,+m[3],+m[1]-1,+m[2]);
  hits.sort((a,b)=>a.i-b.i); const out=[]; let end=-1; hits.forEach(h=>{ if(h.i>=end){ out.push(h); end=h.i+h.len; } }); return out; }
function fmtRange(s){ const ds=parseDates(s); if(!ds.length) return String(s||"").trim();
  let rest=String(s); ds.slice().reverse().forEach(h=>{ rest=rest.slice(0,h.i)+rest.slice(h.i+h.len); });
  if(!/^[\s\-–—,to]*$/i.test(rest)) return String(s).replace(/[ \t]+/g," ").replace(/\n{2,}/g,"\n").trim();
  const f=d=>d.getUTCDate(), M=d=>MONN[d.getUTCMonth()];
  if(ds.length===1) return `${f(ds[0].d)} ${M(ds[0].d)}`;
  const a=ds[0].d,b=ds[ds.length-1].d; return a.getUTCMonth()===b.getUTCMonth()?`${f(a)}–${f(b)} ${M(a)}`:`${f(a)} ${M(a)} – ${f(b)} ${M(b)}`; }
function cellText(el){ const c=el.cloneNode(true); c.querySelectorAll("br").forEach(b=>b.replaceWith("\n")); c.querySelectorAll("p,li,div").forEach(p=>p.append("\n"));
  return c.textContent.replace(/ /g," ").replace(/[ \t]+/g," ").replace(/ *\n */g,"\n").replace(/\n{2,}/g,"\n").trim(); }
function rowsFromHtml(html){ const doc=new DOMParser().parseFromString(html,"text/html"); const tb=[...doc.querySelectorAll("table")].sort((a,b)=>b.rows.length-a.rows.length)[0]; if(!tb) return null;
  return [...tb.rows].map(r=>[...r.cells].map(cellText)); }
function rowsFromText(txt){ return String(txt||"").split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split("\t").map(x=>x.trim())); }
function parseCalRows(rows){
  const H={num:/sprint\s*(#|no|num)/i,range:/duration|date\s*range|period of sprint/i,name:/sprint\s*name/i,promo:/promo/i,freeze:/freeze\s*days?/i,rules:/criteria|timing/i,cap:/total\s*be|capacity/i};
  let hi=rows.findIndex(r=>r.some(c=>H.num.test(c))&&r.some(c=>H.range.test(c)||H.name.test(c)));
  let col={month:0,num:1,range:2,name:3,promo:4,freeze:5,rules:6,cap:-1};
  if(hi>=0){ col={num:-1,range:-1,name:-1,promo:-1,freeze:-1,rules:-1,cap:-1}; rows[hi].forEach((c,i)=>{ for(const k in H) if(col[k]===-1&&H[k].test(c)){ col[k]=i; break; } }); }
  const data=rows.slice(hi+1), out=[], skipped=[];
  data.forEach(r=>{ const g=k=>col[k]>=0?String(r[col[k]]??"").trim():"";
    let n=null; const mn=g("num").match(/(\d+)/); if(mn) n=+mn[1]; const nm=g("name"); const ms=nm.match(/([A-Za-z]+\d+)\.\d{4}\.\d{2}/);
    if(n==null&&ms){ const d=ms[1].match(/(\d+)$/); if(d) n=+d[1]; }
    const ds=parseDates(g("range")); if(!n||!ds.length){ if(r.join("").trim()) skipped.push(r.slice(0,3).join(" | ")); return; }
    const sd=ds[0].d, ed=ds.length>1?ds[ds.length-1].d:new Date(sd.getTime()+11*864e5);
    const cap=col.cap>=0&&g("cap")!==""&&!isNaN(+g("cap"))?+g("cap"):null;
    out.push({n,sid:ms?ms[1]:null,start:iso(sd),end:iso(ed),promo:g("promo").replace(/\n+/g,"; "),freeze:fmtRange(g("freeze")),rules:g("rules"),cap}); });
  return {rows:out,skipped}; }

(function(){ let tip=null, tmr=null, cur=null;
  const hide=()=>{ clearTimeout(tmr); cur=null; if(tip) tip.hidden=true; };
  const full=td=>{ const el=td.querySelector("input:not([type=checkbox]),select,textarea");
    if(el){ const v=el.tagName==="SELECT"?(el.selectedOptions[0]?el.selectedOptions[0].textContent:""):el.value; if(!String(v).trim()) return "";
      const cut=el.tagName==="SELECT"?(String(v).length*7>el.clientWidth-18):(el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+2);
      return cut?String(v):""; }
    const lk=td.querySelector(".links"); if(lk){ const a=[...lk.querySelectorAll("a")].map(x=>x.getAttribute("href")); return a.length&&(lk.scrollWidth>lk.clientWidth+1||a.some(h=>h.length>40))?a.join("\n"):""; }
    const t=td.innerText!==undefined?td.innerText:td.textContent; return (td.scrollWidth>td.clientWidth+1&&String(t).trim())?String(t).trim():""; };
  document.addEventListener("mouseover",e=>{ const td=e.target.closest&&e.target.closest("table.sheet tbody td"); if(td===cur) return; hide(); if(!td) return; cur=td;
    tmr=setTimeout(()=>{ const txt=full(td); if(!txt||cur!==td) return; if(!tip){ tip=document.createElement("div"); tip.id="cellhov"; document.body.appendChild(tip); }
      tip.textContent=txt; tip.hidden=false; const r=td.getBoundingClientRect(), b=tip.getBoundingClientRect();
      let x=r.left, y=r.bottom+4; if(x+b.width>innerWidth-8) x=Math.max(8,innerWidth-b.width-8); if(y+b.height>innerHeight-8) y=Math.max(8,r.top-b.height-4);
      tip.style.left=x+"px"; tip.style.top=y+"px"; },300); });

})();

function nowInfo(id){

  const act=n=>{ const x=g&&g.sp[n-1]; if(!x) return null; const a1=x[0]||"", a2=(x[1]===null||x[1]===undefined)?a1:x[1]; return (a1||a2)?{a1,a2,p:x[2]}:null; };
  const cs=X.sprints.find(s=>s.n===X.cur); let wk=1; if(cs&&cs.sd) wk=Math.min(2,Math.floor((td-cs.sd.getTime())/864e5/7)+1);
  const out={r,cur:null,next:null,last:null,wk};
  if(X.cur){ const a=act(X.cur); if(a) out.cur={n:X.cur,act:wk===1?a.a1:a.a2,other:wk===1?a.a2:a.a1,p:a.p}; }
  for(let n=X.cur+1;n<=X.sprints.length;n++){ const a=act(n); if(a){ out.next={n,act:a.a1||a.a2,p:a.p}; break; } }
  for(let n=X.cur-1;n>=1;n--){ const a=act(n); if(a){ out.last={n,act:a.a2||a.a1}; break; } }
  return out; }

function trS(s){ if(I18N[s]!==undefined) return I18N[s]; if(s.length>600||!/[A-Za-z]/.test(s)) return s;
  for(const [re,f] of I18N_RX){ const m=s.match(re); if(m){ const r=f(...m.slice(1)); if(r!=null) return r; } } return s; }
const I18N_ORIG=new WeakMap(), I18N_ATTR=["title","placeholder","aria-label","label"];
function trText(n){ const v=n.nodeValue, t=v.trim(); if(!t) return; const r=trS(t); if(r===t) return;
  if(!I18N_ORIG.has(n)) I18N_ORIG.set(n,v); const p=n.parentElement; if(p&&p.tagName==="OPTION"&&!p.hasAttribute("value")) p.setAttribute("value",t); n.nodeValue=v.replace(t,r); }
function trAttrs(el){ for(const a of I18N_ATTR){ const v=el.getAttribute&&el.getAttribute(a); if(!v) continue; const t=v.trim(), r=trS(t); if(r===t) continue;
  let o=I18N_ORIG.get(el); if(!o){ o={}; I18N_ORIG.set(el,o); } if(!(a in o)) o[a]=v; el.setAttribute(a,r); } }
const I18N_SKIP=n=>{ if(n.nodeType!==1) return NodeFilter.FILTER_ACCEPT; if(n.matches("textarea")){ trAttrs(n); return NodeFilter.FILTER_REJECT; } return n.matches("script,style,[data-noi18n]")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; };
function trNode(root){ if(!root||LANG!=="id") return; if(root.nodeType===3){ const p=root.parentElement; if(p&&!p.closest("script,style,textarea,[data-noi18n]")) trText(root); return; }
  if(root.nodeType!==1||(root.closest&&root.closest("[data-noi18n]"))||root.matches("script,style")) return; trAttrs(root); if(root.matches("textarea")) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:I18N_SKIP}); let n; while(n=tw.nextNode()){ if(n.nodeType===3) trText(n); else trAttrs(n); } }
function unNode(root){ const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT); let n=root; do{ const o=I18N_ORIG.get(n); if(o!==undefined){ if(n.nodeType===3) n.nodeValue=o; else for(const a in o) n.setAttribute(a,o[a]); I18N_ORIG.delete(n); } } while(n=tw.nextNode()); }

function i18nObserve(){ if(I18N_OBS){ I18N_OBS.disconnect(); I18N_OBS=null; } if(LANG!=="id"||typeof MutationObserver==="undefined") return;
  I18N_OBS=new MutationObserver(ms=>{ for(const m of ms){ if(m.type==="childList") m.addedNodes.forEach(trNode); else if(m.type==="attributes") trAttrs(m.target); else if(m.type==="characterData") trNode(m.target); } });

    for(const k in S.f){ const fv=S.f[k]; if(!fv||(Array.isArray(fv)&&!fv.length)) continue; const c=cfg.cols.find(c=>c.k===k); if(!c) continue; const v=String(val(r,c)??""); if(Array.isArray(fv)){ if(!(fv.includes(v)||(!v&&fv.includes("(blank)")))) return false; continue; } if(c.ft==="text"){ if(!v.toLowerCase().includes(fv.toLowerCase())) return false; } else if(fv==="(blank)"){ if(v) return false; } else if(v!==fv) return false; }
    return true; });
  if(S.sort){ const c=cfg.cols.find(c=>c.k===S.sort); xs=[...xs].sort((a,b)=>{ const x=val(a,c)??"", y=val(b,c)??""; return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*S.dir; }); }
  const opt=(list,v)=>`<option value=""></option>`+[...new Set([...(list||[]),...(v&&!(list||[]).includes(v)?[v]:[])])].map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("");
  const fopts=c=>{ const vs=[...new Set(rows.map(r=>String(val(r,c)??"")))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})); return `<option value="">All</option>`+(vs.includes("")?`<option>(blank)</option>`:"")+vs.filter(Boolean).map(v=>`<option${S.f[c.k]===v?" selected":""}>${esc(v)}</option>`).join(""); };
  let _acc=0; cfg.cols.forEach(c=>{ if(c.fz){ c._left=_acc; _acc+=(c.fw||90); } }); const lastFz=[...cfg.cols].reverse().find(c=>c.fz);
  const fzStyle=c=>`left:${c._left}px;width:${c.fw||90}px;min-width:${c.fw||90}px;max-width:${c.fw||90}px`;
  const cell=(r,c)=>{ const v=val(r,c), w=c.fz?` style="${fzStyle(c)}"`:c.w?` style="min-width:${c.w}px;max-width:${c.w+120}px"`:"";
    const fz=c.fz?(" fz"+(c===lastFz?" fzl":"")):"";

    if(c.t==="select") return `<td class="${fz.trim()}"${w}><select ${a}>${opt(typeof c.opts==="function"?c.opts(r):c.opts,v)}</select></td>`;
    if(c.t==="links") return `<td${w}><textarea ${a} rows="2" placeholder="One link per line">${esc(v??"")}</textarea><div class="links">${linksHtml(v)}</div></td>`;
    if(c.t==="area") return `<td class="${fz.trim()}"${w}><textarea ${a} rows="1">${esc(v??"")}</textarea></td>`;
    if(c.t==="num") return `<td${w}><input ${a} type="number" step="${c.step||'any'}" ${c.min!=null?`min="${c.min}"`:""} ${c.max!=null?`max="${c.max}"`:""} value="${v??""}"></td>`;
    if(c.t==="date") return `<td${w}><input ${a} type="date" value="${esc(v||"")}"></td>`;

  host.innerHTML=`<div class="bar"><input type="search" data-filter="1" placeholder="Search…" value="${esc(S.q)}" aria-label="Search">

   <div class="frame"><table class="sheet"><thead>
    <tr class="h1">${cfg.cols.map(c=>`<th class="${c.t==='calc'?'calc':'inp'}${c.fz?' fz'+(c===lastFz?' fzl':''):''}" style="${c.fz?fzStyle(c):''}" title="${c.t==='calc'?'Automatic – calculated':'Input'}"><button class="sort" data-sort="${c.k}">${esc(c.l)}${S.sort===c.k?(S.dir>0?" ▲":" ▼"):""}</button></th>`).join("")}${cfg.del?'<th data-edit="1"></th>':""}</tr>
    <tr class="h2">${cfg.cols.map(c=>`<th class="${c.fz?'fz'+(c===lastFz?' fzl':''):''}" style="${c.fz?fzStyle(c):''}">${c.nofilter?"":c.ft==="text"?`<input data-filter="1" data-fk="${c.k}" placeholder="filter" value="${esc(S.f[c.k]||"")}">`:`<span class="msf" data-msk="${c.k}"></span>`}</th>`).join("")}${cfg.del?'<th data-edit="1"></th>':""}</tr>
   </thead><tbody>${xs.map(r=>`<tr${cfg.rowStyle?` style="${cfg.rowStyle(r)}"`:""}>${cfg.cols.map(c=>cell(r,c)).join("")}${cfg.del?`<td data-edit="1"><button class="del" data-del="${esc(cfg.rid(r))}" title="Delete row" aria-label="Delete row">×</button></td>`:""}</tr>`).join("")}</tbody></table></div>`;
  const rerender=()=>{ const fr=host.querySelector(".frame"), st=fr?fr.scrollTop:0, sl=fr?fr.scrollLeft:0; sheet(host,cfg); const f2=host.querySelector(".frame"); if(f2){f2.scrollTop=st; f2.scrollLeft=sl;} };
  host.querySelector('input[type=search]').addEventListener("input",e=>{ S.q=e.target.value; clearTimeout(S.t); S.t=setTimeout(()=>{ rerender(); const i=host.querySelector('input[type=search]'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },250); });
  host.querySelectorAll("[data-fk]").forEach(el=>el.addEventListener(el.tagName==="INPUT"?"input":"change",e=>{ S.f[el.dataset.fk]=e.target.value; clearTimeout(S.t); S.t=setTimeout(()=>{ rerender(); if(el.tagName==="INPUT"){ const i=host.querySelector(`[data-fk="${el.dataset.fk}"]`); i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },el.tagName==="INPUT"?300:0); }));
  host.querySelectorAll("[data-msk]").forEach(el=>{ const c=cfg.cols.find(x=>x.k===el.dataset.msk); const vs=[...new Set(rows.map(r=>String(val(r,c)??"")).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const cur=Array.isArray(S.f[c.k])?S.f[c.k]:(S.f[c.k]?[S.f[c.k]]:[]); multiSel(el,"",vs,cur,v=>{ S.f[c.k]=v; rerender(); }); });

  host.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.sort; if(S.sort===k&&S.dir<0){S.sort=null;S.dir=1;} else if(S.sort===k) S.dir=-1; else {S.sort=k;S.dir=1;} rerender(); }));
  host.querySelectorAll("tbody [data-k]").forEach(el=>el.addEventListener("change",e=>{
    const r=rows.find(x=>String(cfg.rid(x))===el.dataset.row); if(!r) return; const c=cfg.cols.find(c=>c.k===el.dataset.k);
    let v=el.value; if(c.t==="num") v=v===""?null:+v;
    if(c.set) c.set(r,v); else r[c.k]=v;
    if(c.t==="links"){ const d=el.nextElementSibling; if(d) d.innerHTML=linksHtml(v); }
    markDirty(); derive(); refreshRow(el.closest("tr"),r); }));
  function refreshRow(tr,r){ if(!tr) return; cfg.cols.forEach((c,i)=>{ if(c.t!=="calc") return; const td=tr.children[i]; if(!td) return; const tmp=document.createElement("tbody"); tmp.innerHTML="<tr>"+cell(r,c)+"</tr>"; td.replaceWith(tmp.firstChild.firstChild); }); if(cfg.after) cfg.after(host); }
  const add=host.querySelector("[data-add]"); if(add) add.addEventListener("click",()=>{ cfg.onAdd(); markDirty(); S.f={}; S.q=""; S.sort=null; derive(); rerender(); const f=host.querySelector(".frame"); f.scrollTop=f.scrollHeight; });
  host.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{ const ok=await dialog("Delete row?",(cfg.delMsg&&cfg.delMsg(b.dataset.del))||`Delete ${b.dataset.del}? This is removed for everyone after you save.`,[{label:"Cancel",value:false},{label:"Delete",value:true,cls:"danger"}]); if(!ok) return; cfg.onDel(b.dataset.del); markDirty(); derive(); rerender(); }));
  if(cfg.after) cfg.after(host);
  applyRO();

  <h3>Langkah demi langkah</h3>
  <div class="frame" style="max-height:none"><table class="sheet"><thead><tr class="h1"><th>Langkah</th><th>Tab</th><th>Kapan</th><th>Yang dilakukan</th><th>Hasil</th></tr></thead><tbody>
   ${step("0","calendar","Sekali setahun; update saat tanggal atau jumlah tim berubah","Upload atau cek tanggal sprint dan deploy flag (FRZ / APPR / BPD) dari Confluence Sprint Global Calendar. Isi <b>Total BE</b> = jumlah dev BE per sprint. Di <b>Konfigurasi</b>: daftar dropdown, warna program, nama <b>Owner / PIC</b>, T-shirt size dan urgency.","Kalender dan kapasitas dipakai oleh tab Gantt dan Kapasitas")}
   ${step("1","okr","Awal tahun / semester; setiap review OKR","Isi Tema (T1, T2…), Objective (O1…, terhubung ke tema) dan Key Result dengan target H1/H2. Update pencapaian di setiap review.","Obj dan KR menjadi dropdown di Wishlist dan Roadmap")}
   ${step("2","wishlist","Setiap ada request masuk; selama discovery","Tambah satu baris per request: item, masalah, scope, peminta, KR, link PRD / Figma. Selama discovery isi Impact (1–5), Urgency, Confidence (0–1), Size dan Target Kuartal → Priority Score dihitung otomatis. Jaga <b>Status discovery</b> tetap update.","Item Ready muncul paling atas di dropdown Roadmap; Cek Data menampilkan item Ready yang menunggu keputusan")}
   ${step("3","roadmap","Perencanaan kuartal / sprint, saat item disetujui","Tambah baris dan pilih Initiative dari dropdown Wishlist. Isi Obj, KR, Product Area, Klien, Program, Channel, <b>Owner / PIC</b>, Priority, Size, Status dan link (Jira, PRD, Figma). Mulai/Selesai, tanggal, kuartal dan horizon terisi dari Gantt.","Wishlist menampilkan status pipeline “Promoted to Roadmap” dan Roadmap ID")}
   ${step("4","gantt","Setiap sprint planning","Tambahkan initiative lewat “＋ Tambah initiative ke Gantt…”. Klik sel sprint: aktivitas Week 1, aktivitas Week 2 (sama dengan Week 1 kecuali diubah) dan jumlah Orang di sprint itu. Jaga baris utilisasi BE di bawah 100%.","Man-sprint, utilisasi dan tanggal roadmap ter-update otomatis")}

  </tbody></table></div>
  <h3 style="margin-top:22px">Aturan per tab (sesuai urutan kerja)</h3>
  <div class="gcols">
   <div><h3>⓪ Kalender Sprint & Konfigurasi</h3><ul>
    <li><b>⇪ Upload kalender</b>: tempel tabel sprint yang disalin dari Confluence atau upload template Excel (⇩ Unduh template di dialog yang sama). Tanggal, promo dan info freeze terisi; Total BE hanya berubah jika upload berisi nilai.</li>
    <li><b>＋ Sprint</b> menambah sprint di akhir (Sprint ID melanjutkan baris di atas, tanggal dua minggu setelahnya). Hanya sprint terakhir yang bisa dihapus. Nama sprint = Sprint ID.yymm.dd dari tanggal mulai (otomatis).</li>
    <li>Deploy flag per minggu dibuat dari sprint; isi FRZ / APPR / BPD dan detail per minggu.</li>
    <li>Konfigurasi: satu pilihan per baris. Isi dulu nama <b>Owner / PIC</b> di sini. T-shirt size dan urgency bisa ditambah, diganti nama atau dihapus (ganti nama ikut meng-update Wishlist / Roadmap).</li>
    <li>Nama <b>Squad</b> di header bisa diubah dan tampil di Ringkasan serta di ekspor Excel.</li>
   </ul></div>
   <div><h3>① OKR</h3><ul>
    <li>Tema → Objective → Key Result. Isi target H1/H2 di awal dan pencapaian di setiap review – Cek Data menandai KR tanpa angka H2.</li>
   </ul></div>
   <div><h3>② Wishlist</h3><ul>
    <li><b>Status discovery</b> (manual) = sejauh mana idenya: New → Need More Context → In Assessment → Ready for Prioritization, atau Parked / Dropped.</li>
    <li><b>Status pipeline</b> (otomatis) = apakah item sudah dipromosikan ke Roadmap, sudah Live atau di-drop di sana.</li>
    <li><b>Priority Score = Impact × Urgency × Confidence ÷ Effort</b> – makin tinggi, makin cepat sebaiknya dikerjakan. Hanya muncul jika keempatnya terisi.<ul>
     <li><b>Impact</b> (1–5): seberapa besar dampaknya ke bisnis / KR / user jika jadi. 1 = kecil, 5 = sangat besar.</li>
     <li><b>Urgency</b>: Red = 3 (mendesak, ada deadline atau risiko bisnis) · Yellow = 2 (penting, bisa dijadwalkan) · Green = 1 (nice to have).</li>
     <li><b>Confidence</b> (0–1): seberapa yakin kita soal impact dan size – 0.5 = masih tebakan, 0.8 = cukup yakin, 1 = didukung data.</li>
     <li><b>Effort</b> (otomatis dari Size): S = 0.5 · M = 1 · L = 2.5 · XL = 4.5 · XXL = 7 sprint.</li>
     <li>Contoh: Impact 4 × Red 3 × Confidence 0.8 ÷ M 1 = <b>9.6</b>; item yang sama dengan Size L (2.5) = <b>3.8</b>. Bobot urgency dan effort per size bisa diubah di Konfigurasi.</li></ul></li>
    <li><b>Link PRD</b> dan <b>link Figma</b>: satu link per baris. Tanggal masuk otomatis hari ini untuk baris baru.</li>
    <li><b>Hapus</b>: item yang belum ada di Roadmap langsung terhapus. Item yang sudah ada di Roadmap meminta konfirmasi dulu, lalu baris Roadmap dan rencana Gantt-nya ikut terhapus. Status discovery-nya terkunci selama ada di Roadmap.</li>
    <li>Wishlist tidak punya Priority manual: <b>Priority Score</b> adalah masukannya, <b>Priority (P0–Pn)</b> diputuskan di Roadmap. Isi <b>Target Kuartal</b> jika peminta butuh di waktu tertentu.</li>
   </ul></div>
   <div><h3>③ Roadmap</h3><ul>
    <li>Dropdown Initiative berisi item Wishlist yang (1) punya nama Item, (2) belum dipakai baris Roadmap lain di tahun yang sedang dibuka dan (3) bukan Dropped atau Done (Live). Urutan: Ready for Prioritization dulu (Priority Score tertinggi dulu), lalu In Assessment, lalu sisanya.</li>
    <li>Item yang sudah ada di Roadmap tahun lain bisa dipilih lagi di tahun berikutnya (carry-over). Initiative yang dipilih di suatu baris selalu tetap ada di daftar baris itu.</li>
    <li>Setelah dipilih, item Wishlist menjadi <b>Promoted to Roadmap</b> dan otomatis mendapat Roadmap ID. Hubungannya memakai Wishlist ID, jadi ganti nama item tidak memutus link.</li>
    <li><b>Putuskan di sesi prioritisasi</b> (bulanan / kuartalan): dropdown menampilkan item <b>Ready for Prioritization</b> dulu, Priority Score tertinggi dulu, lalu In Assessment, lalu sisanya. Memilih item akan mengubah status discovery-nya jadi <b>Ready for Prioritization</b> dan menguncinya (ada pesan jika sebelumnya belum Ready). Item Ready yang belum dipilih tampil di Cek Data → <b>Ready, menunggu keputusan</b>.</li>
    <li>Saat dipilih, Product area, KR (+ Objective-nya), Size serta link PRD / Figma yang masih kosong disalin dari Wishlist. Perbedaan setelahnya ditampilkan di Cek Data.</li>
    <li><b>Target Q (Wishlist)</b> tampil di sebelah Kuartal; ⚠ merah jika Gantt selesai setelah target.</li>
    <li><b>Carry to Next Year</b> = tidak selesai tahun ini: dianggap tutup di tahun ini (seperti Parked) dan tampil sebagai “Carry to ${+ST.year+1}” di Horizon dan Wishlist. ＋ Tahun baru membawanya sebagai Not Started.</li>
    <li>Isi <b>Owner / PIC</b> (satu penanggung jawab) dan Priority untuk setiap initiative aktif.</li>
    <li>Catatan timeline bisa beberapa baris. Priority, Status dan Catatan timeline juga bisa diubah di Gantt Chart – keduanya tetap sinkron.</li>
   </ul></div>
   <div><h3>④ Gantt Chart</h3><ul>
    <li><b>＋ Tambah initiative ke Gantt…</b> berisi baris Roadmap tahun ini yang punya Initiative dan belum ada di Gantt – baris <b>Aktif</b> dulu; Live / Parked / Dropped / Carry to next year di grup terpisah (biasanya tidak direncanakan). Urutan: Wishlist → Roadmap → Gantt. Cek Data punya tombol <b>＋ Add all</b> untuk initiative aktif.</li>

const G={q:"",prog:[],area:[],stat:[],prio:[],sched:false,from:true,details:true,hideDone:true,dcols:(()=>{ try{ const v=JSON.parse(localStorage.getItem("fas-gantt-dcols")||"null"); if(Array.isArray(v)) return v.filter(k=>["apc","prio","status","tl","start","end"].includes(k)); }catch(e){} return ["apc","prio","status","tl","start","end"]; })()};

function detSel(host){ if(!host) return;

  const btn=host.querySelector("button");

  btn.addEventListener("click",ev=>{ ev.stopPropagation(); document.querySelectorAll(".mspanel").forEach(p=>p.remove());

      GD_KEYS.map(k=>`<label><input type="checkbox" value="${k}"${G.dcols.includes(k)?" checked":""}> ${esc(GD_LBL[k])}</label>`).join("");
    document.body.appendChild(p); const r=btn.getBoundingClientRect(); p.style.left=Math.max(8,Math.min(window.innerWidth-250,r.left))+"px"; p.style.top=(r.bottom+4)+"px"; btn.setAttribute("aria-expanded","true");
    try{ trNode(p); }catch(e){}
    const apply=()=>{ G.dcols=GD_KEYS.filter(k=>p.querySelector(`input[value="${k}"]`).checked); save(); btn.textContent=txt()+" ▾"; btn.classList.toggle("on",G.dcols.length>0&&G.dcols.length<GD_KEYS.length); drawGantt(); };
    p.addEventListener("change",apply);
    p.querySelector('[data-a="all"]').onclick=()=>{ p.querySelectorAll("input").forEach(x=>x.checked=true); apply(); };
    p.querySelector('[data-a="none"]').onclick=()=>{ p.querySelectorAll("input").forEach(x=>x.checked=false); apply(); };
    const close=e=>{ if(!p.contains(e.target)&&e.target!==btn){ p.remove(); btn.setAttribute("aria-expanded","false"); document.removeEventListener("click",close,true); } };

const loadJSZip=()=>window.JSZip?Promise.resolve(window.JSZip):new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=()=>window.JSZip?res(window.JSZip):rej(new Error("JSZip missing")); s.onerror=()=>rej(new Error("could not load the zip library")); document.head.appendChild(s); });

const xlLet=n=>{ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
const xlEsc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

    const up=rows.get(+m[2]-1); if(up){ for(const u of Array.from(up.children)){ if(u.getAttribute("r")===m[1]+(+m[2]-1)){ if(u.getAttribute("s")) c.setAttribute("s",u.getAttribute("s")); break; } } }

    if(typeof v==="number"&&isFinite(v)){ const e=doc.createElementNS(XL_NS,"v"); e.textContent=String(v); c.appendChild(e); return; }
    const s=String(v); if(s==="") { c.setAttribute("t","inlineStr"); const is=doc.createElementNS(XL_NS,"is"), t=doc.createElementNS(XL_NS,"t"); is.appendChild(t); c.appendChild(is); return; }
    c.setAttribute("t","inlineStr"); const is=doc.createElementNS(XL_NS,"is"), t=doc.createElementNS(XL_NS,"t"); t.setAttributeNS("http://www.w3.org/XML/1998/namespace","xml:space","preserve"); t.textContent=s; is.appendChild(t); c.appendChild(is); };

async function importXlsx(ev){
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  if(!canWrite) return toast("You have view-only access, so you cannot import.");
  const ok=await dialog("Replace all data with this Excel file?",`${f.name} must be a FAS Planner (Excel) workbook – e.g. one made with Export Excel. The ${ST.year} plan (OKR, Roadmap, Gantt, Sprint Calendar) and the Wishlist are replaced after you save. Other years are kept.`,[{label:"Cancel",value:false},{label:"Replace data",value:true,cls:"danger"}]); if(!ok) return;
  try{ const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array"}); const s=fromWorkbook(wb,f.name); ST.okr=s.okr; ST.cal=s.cal; ST.rm=s.rm; ST.gantt=s.gantt; ST.wish=s.wish; ST.config=s.config; ST.comments=s.comments||{}; syncYear(); markDirty(); render(view); toast("Imported – review, then Save changes"); }
  catch(e){ toast("Could not import: "+e.message); }
}
function fromWorkbook(wb,fname){
  if(wb.Sheets["Dashboard"]&&wb.Sheets["Roadmap"]&&wb.Sheets["Gantt Chart"]&&String((wb.Sheets["Roadmap"]["B4"]||{}).v||"").startsWith("Initiative")) return fromTemplateWB(wb,fname);
  const sh=n=>{ const s=wb.Sheets[n]; if(!s) throw new Error(`sheet "${n}" not found`); return s; };
  const raw=(ws,r,c)=>{ const x=ws[XLSX.utils.encode_cell({r:r-1,c:c-1})]; return x?x:null; };
  const V=(ws,r,c)=>{ const x=raw(ws,r,c); return x?x.v:null; };
  const T=v=>v==null?"":(typeof v==="number"&&!Number.isInteger(v)?String(+v.toFixed(4)):String(v).trim());
  const N=v=>typeof v==="number"?v:null;
  const D=v=>typeof v==="number"?new Date(Date.UTC(1899,11,30)+Math.round(v*864e5)).toISOString().slice(0,10):"";
  const s={meta:{source:fname},config:JSON.parse(JSON.stringify(ST.config))};
  const k=sh("Sprint Calendar"); s.cal={sprints:[],weeks:{},gaps:ST.cal.gaps||[]};
  for(let r=5;r<=200;r++){ const n=N(V(k,r,1)); if(n) s.cal.sprints.push({n,start:D(V(k,r,3)),end:D(V(k,r,4)),cap:N(V(k,r,8)),name:T(V(k,r,9)),promo:T(V(k,r,10)),freeze:T(V(k,r,11)),rules:T(V(k,r,12))}); }
  for(let r=5;r<=500;r++){ const key=T(V(k,r,1)); if(/^SP\d+-W[12]$/.test(key)) s.cal.weeks[key]={flag:T(V(k,r,6)),detail:T(V(k,r,7))}; }
  const o=sh("OKR"); s.okr={themes:[],objs:[],krs:[]};
  for(let r=1;r<=60;r++){ const a=T(V(o,r,1)); if(/^T\d+$/.test(a)) s.okr.themes.push({id:a,name:T(V(o,r,2))}); else if(/^O\d+$/.test(a)) s.okr.objs.push({id:a,theme:T(V(o,r,2)),name:T(V(o,r,3)),krs:T(V(o,r,4))});
    else if(r>16&&/^\d+(\.\d+)?$/.test(a)&&T(V(o,r,2))) s.okr.krs.push({id:a.includes(".")?a:a+".0",text:T(V(o,r,2)),tribe:T(V(o,r,3)),platform:T(V(o,r,4)),h1t:T(V(o,r,5)),h1a:T(V(o,r,6)),h2t:T(V(o,r,7)),h2a:T(V(o,r,8)),notes:T(V(o,r,10))}); }
  const rm=sh("Roadmap"); s.rm=[]; const RK={1:"id",3:"obj",5:"kr",6:"name",7:"area",8:"client",9:"prog",10:"chan",11:"prio",12:"rank",13:"size",14:"status",22:"tl",24:"jira",25:"prd",26:"figma",27:"dep",28:"notes",29:"src"};
  for(let r=5;r<=600;r++){ if(!T(V(rm,r,6))) continue; const x={}; for(const c in RK) x[RK[c]]=T(V(rm,r,+c)); if(!x.id) x.id="RM-"+String(r-4).padStart(3,"0"); s.rm.push(x); }
  const w=sh("Wishlist"); s.wish=[]; const WK=["id","date","area","req","item","desc","scope","bimpact","notes","kr","omni","impact","urg","conf","size",null,null,"prio","prd","figma","tech","reqtl","groom",null,null,"tq"];
  for(let r=5;r<=800;r++){ if(!T(V(w,r,5))) continue; const x={}; WK.forEach((key,i)=>{ if(!key) return; const v=V(w,r,i+1); x[key]=key==="impact"||key==="conf"?N(v):key==="date"?D(v):T(v); }); if(!x.id) x.id="WL-"+String(r-4).padStart(3,"0"); s.wish.push(x); }
  const g=sh("Gantt Chart"); let hdr=13,W1=9; for(let r=8;r<=20;r++) for(let c=1;c<=20;c++) if(T(V(g,r,c))==="End"){hdr=r;W1=c+1;}
  s.gantt=[];
  for(let r=hdr+1;r<=hdr+500;r++){ const a=T(V(g,r,1)), b=T(V(g,r,2)); if(/END MARKER|BATAS AKHIR/i.test(b)) break; let id=a||(/^RM-\d+/.test(b)?b.split(" – ")[0]:""); if(!id) continue;
    const row={id,sp:[]}; if(id==="TECH-DEBT") row.label=b;
    for(let i=0;i<Math.max(24,s.cal.sprints.length);i++){ const c=W1+i*3; const c2=raw(g,r,c+1); const a1=T(V(g,r,c)); const isF=c2&&c2.f; row.sp.push([a1,isF||!c2?null:T(c2.v),N(V(g,r,c+2))]); }
    s.gantt.push(row); }
  s.gantt.sort((a,b)=>(a.id==="TECH-DEBT"?0:1)-(b.id==="TECH-DEBT"?0:1));
  try{ const c=sh("Config"); const progs=[]; for(let r=15;r<=40;r++){ const p=T(V(c,r,11)); if(p) progs.push({name:p,color:N(V(c,r,12))}); } if(progs.length) s.config.programs=progs; }catch(e){}
  return s;
}

/* ================= new planning year ================= */
async function newYear(){
  if(!canWrite) return toast("You have view-only access.");
  syncYear(); const ys=Object.keys(ST.years).sort(); const src=ys[ys.length-1]; const ny=String(+src+1); const S=ST.years[src];
  const open=(S.rm||[]).filter(r=>r.name&&!["Live","Dropped"].includes(r.status));
  const d=document.createElement("div"); d.className="dlg";
  d.innerHTML=`<div role="dialog" aria-modal="true"><h3>Start planning ${ny}</h3><p>Creates a new ${ny} plan next to ${src}. The Wishlist and Config stay shared across years; ${src} stays as it is.</p>
   <label style="display:flex;gap:8px;margin-bottom:8px"><input type="checkbox" id="nyokr" checked> Copy OKR themes, objectives and key results from ${src} (achievements cleared)</label>
   <label style="display:flex;gap:8px;margin-bottom:8px"><input type="checkbox" id="nyrm" checked> Carry over ${open.length} open initiatives (not Live / Dropped) into the ${ny} Roadmap and Gantt</label>
   <label style="display:flex;gap:8px;margin-bottom:14px;align-items:center">First sprint starts <input type="date" id="nystart" value="${(()=>{ const d0=new Date(Date.UTC(+ny,0,2)); while(d0.getUTCDay()!==1) d0.setUTCDate(d0.getUTCDate()+1); return iso(d0); })()}" style="font:13px var(--f-body);padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--in-cell);color:var(--ink)"></label>
   <div class="acts"><button class="btn" data-a="c">Cancel</button><button class="btn primary" data-a="ok">Create ${ny}</button></div></div>`;
  document.body.appendChild(d);
  const res=await new Promise(r=>d.addEventListener("click",e=>{ const a=e.target.dataset&&e.target.dataset.a; if(a) r(a); else if(e.target===d) r("c"); }));
  const okr=d.querySelector("#nyokr").checked, carry=d.querySelector("#nyrm").checked, st=d.querySelector("#nystart").value; d.remove(); if(res!=="ok") return;
  const clone=o=>JSON.parse(JSON.stringify(stripCalc(o)));
  const last=(S.cal&&S.cal.sprints||[]).slice(-1)[0]||{}; const sprints=[], weeks={};
  let d0=new Date(st+"T00:00:00Z");
  for(let n=1;n<=24;n++){ const e=new Date(d0.getTime()+11*864e5); const yy=String(d0.getUTCFullYear()).slice(2), mm=String(d0.getUTCMonth()+1).padStart(2,"0"), dd=String(d0.getUTCDate()).padStart(2,"0");
    sprints.push({n,start:iso(d0),end:iso(e),cap:last.cap??null,name:`SP${String(n).padStart(2,"0")}.${yy}${mm}.${dd}`,promo:"",freeze:"",rules:""});
    [1,2].forEach(k=>{ const key=`SP${String(n).padStart(2,"0")}-W${k}`; weeks[key]={flag:"",detail:"",key}; });
    d0=new Date(d0.getTime()+14*864e5); }
  let okrN={themes:[],objs:[],krs:[]}; if(okr){ okrN=clone(S.okr); (okrN.krs||[]).forEach(k=>{ k.h1a=""; k.h2a=""; }); }
  const rm=[], gantt=[]; const td=(S.gantt||[]).find(g=>g.id==="TECH-DEBT");
  gantt.push({id:"TECH-DEBT",label:td?td.label:"Tech Debt / Prod Issue (reserved capacity)",sp:Array.from({length:24},()=>["Tech Debt",null,null])});
  if(carry) open.forEach((r,i)=>{ const x=clone(r); if(x.status==="Carry to Next Year") x.status="Not Started"; x.id="RM-"+String(i+1).padStart(3,"0"); x.src=`Carried over from ${src} ${r.id}`; rm.push(x); gantt.push({id:x.id,sp:Array.from({length:24},()=>["",null,null])}); });
  ST.years[ny]={okr:okrN,cal:{sprints,weeks,gaps:[]},rm,gantt,comments:{}};
  useYear(ny); try{localStorage.setItem("fas-year",ny);}catch(e){} for(const k in SHEETS) delete SHEETS[k]; markDirty(); render(view);
  toast(`${ny} created – check the Sprint Calendar dates, then Save changes`);
}

/* ================= boot ================= */
function boot(){
  shell(); canWrite=false; artifactNS=undefined;
  { const t=document.getElementById("mmExtra"); if(t&&window.__CONF){ const l=document.createElement("a"); l.className="btn sm"; l.href=window.__CONF.pageUrl; l.target="_blank"; l.rel="noopener"; l.textContent="Confluence DB ↗"; l.title="Data is stored on the Confluence page [0] FAS Planner Database"; t.append(l); const s=document.createElement("button"); s.className="btn sm"; s.textContent="Sign out"; s.title="Signed in as "+(window.__CONF.me||""); s.addEventListener("click",async()=>{ if(dirty){ const ok=await dialog("Sign out with unsaved changes?","Your edits are kept as a draft in this browser, but they are not in Confluence yet.",[{label:"Cancel",value:false},{label:"Sign out anyway",value:true,cls:"danger"}]); if(!ok) return; } window.__CONF.signOut(); }); t.append(s); } }
  let t="summary"; try{ t=localStorage.getItem("fas-planner-tab")||"summary"; }catch(e){}
  const hv=(location.hash||"").slice(1); if(TABS.some(x=>x[0]===hv)) t=hv;
  show(t);
  (async()=>{
    let a=null,dl=null,u=null;
    a=window.__CONF||null;
    dl={};
    try{ u=window.claude?await window.claude.use("user"):null; }catch(e){ u=null; }
    artifactNS=a; downloadsNS=dl;
    canWrite=!!a;
    document.getElementById("xlexp").hidden=!dl; document.getElementById("xlimpl").hidden=!canWrite;
    // restore a draft left by a reload
    try{ const d=JSON.parse(localStorage.getItem(DKEY)||"null");
      if(d&&canWrite){ const newer=(ST.meta.saved||"")!==(d.base||"");
        const ans=await dialog("Unsaved changes found",newer?"You had unsaved edits, but someone saved a newer version since. Restoring your draft replaces their changes.":"You have unsaved edits from your last visit.",[{label:"Discard draft",value:"d"},{label:"Restore my draft",value:"r",cls:"primary"}]);
        if(ans==="r"){ ST=normYears(d.state); useYear(pickYear()); dirty=true; } else { localStorage.removeItem(DKEY); } } }catch(e){}
    render(view); applyRO();
    if(a&&a.seeded&&!dirty){ markDirty(); toast("Data file loaded – press Save changes to write it to Confluence."); }
    initPeople();
  })();
}
boot();
})();
</script>
<script id="loader">
function downloadBlob(data,name){
  try{ const b=data instanceof Blob?data:new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const u=URL.createObjectURL(b), a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
  catch(e){ alert("Download failed: "+(e&&e.message||e)); }
}
(function(){
"use strict";
var PAGE_URL="https://gdncomm.atlassian.net/wiki/spaces/PGM/pages/2446950561";
var API="/api/db", H={"X-FAS-Planner":"1"};
var CONF={pageUrl:PAGE_URL,seeded:false,baseVersion:null,me:"",
  save:async function(state,summaryHtml,msg){
    var r; try{ r=await fetch(API,{method:"POST",credentials:"same-origin",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify({state:state,summary:summaryHtml,baseVersion:CONF.baseVersion,message:msg})}); }
    catch(e){ throw {code:"network",message:"Could not reach the planner server. Check your connection – your edits are kept."}; }
    var j={}; try{ j=await r.json(); }catch(e){}
    if(r.status===409) throw {code:"conflict",message:j.error||"Someone saved first."};
    if(r.status===401){ throw {code:"no_login",message:"Your session has expired. Sign in again (your edits are kept as a draft), then save."}; }
    if(!r.ok) throw {code:j.code||"error",message:j.error||("HTTP "+r.status)};
    CONF.baseVersion=j.version; CONF.seeded=false; return j;
  },
  signOut:async function(){ try{ await fetch("/api/logout",{method:"POST",credentials:"same-origin",headers:H}); }catch(e){} location.reload(); }
};
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function screen(html){ document.getElementById("root").innerHTML='<div class="wrap" style="padding-top:64px"><div style="max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px">'+html+'</div></div>'; }
function boot(state){
  document.getElementById("state").textContent=JSON.stringify(state);
  document.getElementById("root").innerHTML="";
  window.__CONF=CONF;
  var s=document.createElement("script"); s.textContent=document.getElementById("app").textContent; document.body.appendChild(s);
}
function fail(title,msg,extra){
  screen('<h2 style="margin-bottom:8px">'+esc(title)+'</h2><p class="sub" style="margin-bottom:16px">'+msg+'</p><div class="bar"><button class="btn primary" id="ldRetry">Try again</button>'+(extra||"")+'</div>');
  document.getElementById("ldRetry").addEventListener("click",function(){ location.reload(); });
  var so=document.getElementById("ldOut"); if(so) so.addEventListener("click",function(){ CONF.signOut(); });
}
function login(msg){
  var tick='<span style="color:var(--good);font-weight:700;margin-right:8px">✓</span>';
  var li=function(t){ return '<li style="display:flex;align-items:flex-start;margin:0 0 8px">'+tick+'<span>'+t+'</span></li>'; };
  screen('<h2 style="margin-bottom:6px">FAS Planner</h2><p class="sub" style="margin-bottom:18px">Sign in with your Atlassian account (the one you use for Confluence).</p>'
   +(msg?'<p style="color:var(--bad);margin:0 0 14px">'+esc(msg)+'</p>':'')
   +'<a class="btn primary" href="/api/login" style="display:inline-block;text-decoration:none;padding:9px 16px;margin-bottom:20px">Sign in with Atlassian</a>'
   +'<div style="border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.45">'
   +'<div style="font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px">🔒 Safe sign-in – how it works</div>'
   +'<ul style="list-style:none;margin:0;padding:0">'
   +li('<b>Your password stays with Atlassian.</b> You sign in on Atlassian\'s own page (id.atlassian.com). This website never sees or stores your password.')
   +li('<b>Official Atlassian integration</b> (OAuth 2.0 via the Atlassian API). You approve exactly what the planner may do before it gets access.')
   +li('<b>Limited access:</b> it only reads and saves the planner page <i>[0] FAS Planner Database</i> and its data file, and reads your name to show who saved last. It acts with your own Confluence permissions.')
   +li('<b>Nothing kept on the server.</b> The sign-in key is stored encrypted in this browser only and is removed when you click Sign out.')
   +li('<b>You stay in control:</b> remove the planner\'s access at any time in <a href="https://id.atlassian.com/manage-profile/apps" target="_blank" rel="noopener">Atlassian account → Connected apps</a>.')
   +'</ul></div>');
}
function emptyDb(j){
  screen('<h2 style="margin-bottom:6px">The planner database is empty</h2><p class="sub" style="margin-bottom:14px">The Confluence page has no planner data yet. Load the starting data file (<code>fas_planner_seed.json</code> from the setup package), check it, then press <b>Save changes</b> to write it to Confluence.</p>'
   +'<label class="btn primary" style="display:inline-block">Choose data file…<input type="file" id="seedFile" accept=".json,application/json" hidden></label> <span id="seedMsg" class="muted"></span>');
  document.getElementById("seedFile").addEventListener("change",async function(e){ var f=e.target.files[0]; if(!f) return; var m=document.getElementById("seedMsg");
    try{ var st=JSON.parse(await f.text()); if(!st||!st.years) throw new Error("this is not a planner data file"); CONF.seeded=true; CONF.baseVersion=null; boot(st); }
    catch(err){ m.textContent="Could not read the file: "+err.message; } });
}
async function start(){
  screen('<h2>FAS Planner</h2><p class="sub">Loading data from Confluence…</p>');
  var r,j={};
  try{ r=await fetch(API,{credentials:"same-origin",headers:H,cache:"no-store"}); j=await r.json(); }
  catch(e){ return fail("Could not reach the planner server","Check your internet connection, then try again."); }
  if(r.status===401) return login(j.code==="no_login"&&j.error&&!/^Sign in/.test(j.error)?j.error:"");
  if(!r.ok) return fail("Could not load data from Confluence",esc(j.error||("HTTP "+r.status)),'<button class="btn" id="ldOut">Sign out</button>');
  CONF.me=j.me||j.email||""; CONF.baseVersion=j.version;
  if(!j.state) return emptyDb(j);
  boot(j.state);
}
start();
})();
</script>
